{# Line icons drawn for this app (24×24, stroke = text colour). Usage: {{ icon("leads") }} #}
{% macro icon(name, size=18) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "dashboard" -%}
  <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/>
  <rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name == "leads" -%}
  <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>
{%- elif name == "imports" -%}
  <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
{%- elif name == "templates" -%}
  <path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h6"/>
{%- elif name == "campaigns" -%}
  <path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/>
{%- elif name == "replies" -%}
  <path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-5 4V6a1 1 0 0 1 1-1z"/>
{%- elif name == "senders" -%}
  <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{%- elif name == "suppression" -%}
  <circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>
{%- elif name == "reports" -%}
  <path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/>
{%- elif name == "users" -%}
  <circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.4.6 4 2.8 4 6"/>
{%- elif name == "settings" -%}
  <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>
{%- elif name == "search" -%}
  <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{%- elif name == "undo" -%}
  <path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>
{%- elif name == "clock" -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "close" -%}
  <path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == "check" -%}
  <path d="M5 12l5 5 9-10"/>
{%- elif name == "alert" -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>
{%- elif name == "logout" -%}
  <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/>
{%- elif name == "account" -%}
  <circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.2-2 3.2-3 5.5-3s4.3 1 5.5 3"/>
{%- elif name == "inbox" -%}
  <path d="M3 13l3-8h12l3 8v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 13h5l1 3h6l1-3h5"/>
{%- elif name == "hand" -%}
  <path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10V4.5a1.5 1.5 0 0 1 3 0V11M14 10.5V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-.5a6 6 0 0 1-4.8-2.4L3 14.5a1.5 1.5 0 0 1 2.3-1.9L8 15"/>
{%- elif name == "star" -%}
  <path d="M12 3l2.7 5.6 6.1.8-4.4 4.3 1 6.1L12 17l-5.4 2.8 1-6.1L3.2 9.4l6.1-.8z"/>
{%- elif name == "calendar" -%}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif name == "send" -%}
  <path d="M4 12l16-8-6 16-3-6z"/><path d="M11 14l9-10"/>
{%- elif name == "mail" -%}
  <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{%- elif name == "lock" -%}
  <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == "eye" -%}
  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "shield" -%}
  <path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>
{%- elif name == "trend" -%}
  <path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>
{%- elif name == "flag" -%}
  <path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>
{%- endif -%}
</svg>
{%- endmacro %}
