# /etc/nginx/sites-available/outreach  (symlink into sites-enabled). Touches nothing else on the server.
# Port 80 only: Cloudflare (orange cloud) ends HTTPS and connects here over HTTP.
# Cloudflare settings for this host: SSL/TLS mode "Flexible", "Always Use HTTPS" on.

server {
    listen 80;
    server_name outreach.avigronix.com;

    # Real visitor IP from Cloudflare (only trusted when the request comes from a Cloudflare address).
    # Keep in sync with https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 12m;   # lead uploads are up to 10 MB

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location / {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        # $remote_addr is the real visitor IP here (after real_ip above); send only that, so it can't be spoofed.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Visitors always reach Cloudflare over HTTPS ("Always Use HTTPS"); the hop to here is HTTP.
        # Fixed value, so the app always builds https:// URLs and never sees itself on http.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;    # CSV exports
    }
}
